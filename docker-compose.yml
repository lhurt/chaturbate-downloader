services:
  cb-stream-saver-dev:
    build: .
    container_name: cb-stream-saver-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CB_PROXY_URL: ${CB_PROXY_URL:-}
      CONTACT_SHEET_INTERVAL_SECONDS: ${CONTACT_SHEET_INTERVAL_SECONDS:-60}
      CONTACT_SHEET_TILE_WIDTH: ${CONTACT_SHEET_TILE_WIDTH:-160}
      CONTACT_SHEET_COLUMNS: ${CONTACT_SHEET_COLUMNS:-10}
    volumes:
      - ./downloads:/app/downloads
